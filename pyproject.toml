[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tlemma-enum"
version = "0.1.0"
authors = [
  { name = "Massimo Michelutti", email = "massimo.michelutti@studenti.unitn.it" },
  { name = "Emanuele Civini", email = "emanuele.civini@studenti.unitn.it" },
  { name = "Gabriele Masina", email = "gabriele.masina@unitn.it" },
]
description = ""
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "allsat_cnf @ git+https://github.com/masinag/allsat-cnf@main",
  "PySMT>=0.9.7.dev431",
  "pytest>=9.0.0",
  "tqdm>=4.67.3",
]

[dependency-groups]
dev = ["ruff>=0.4.0"]

[tool.hatch.build.targets.wheel]
packages = ["tlemma_enum"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 120
